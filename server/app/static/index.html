<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2933">
  <title>Werkstatt-Heizung</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1>Werkstatt-Heizung</h1>
      <label>Benutzername <input name="username" autocomplete="username" required></label>
      <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary">Anmelden</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" hidden>
    <header class="topbar">
      <h1>Werkstatt-Heizung</h1>
      <span id="agent-pill" class="pill">…</span>
      <button id="logout" class="btn ghost small" title="Abmelden">Abmelden</button>
    </header>

    <main class="content">
      <div id="banner" class="banner" hidden></div>

      <section id="heaters" class="heaters"></section>

      <section class="card">
        <div class="card-head">
          <h2>Raumtemperatur</h2>
          <select id="range">
            <option value="6">6 h</option>
            <option value="24" selected>24 h</option>
            <option value="168">7 Tage</option>
          </select>
        </div>
        <div id="chart" class="chart"></div>
        <div id="legend" class="legend"></div>
      </section>

      <section class="card">
        <h2>Ereignisse</h2>
        <ul id="events" class="events"></ul>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <template id="heater-tpl">
    <article class="card heater">
      <div class="card-head">
        <h2 class="h-name"></h2>
        <span class="pill h-badge"></span>
      </div>
      <div class="metrics">
        <div><span class="m-label">Raum</span><span class="m-value h-room">–</span></div>
        <div><span class="m-label">Modus</span><span class="m-value h-mode">–</span></div>
        <div><span class="m-label">Aus in</span><span class="m-value h-remaining">–</span></div>
        <div><span class="m-label">Spannung</span><span class="m-value h-voltage">–</span></div>
      </div>
      <p class="h-note muted"></p>
      <div class="controls">
        <label class="inline">Laufzeit
          <select class="h-minutes">
            <option value="30">30 min</option>
            <option value="60">1 h</option>
            <option value="120" selected>2 h</option>
            <option value="180">3 h</option>
            <option value="240">4 h</option>
          </select>
        </label>
        <button class="btn primary h-vollgas">Vollgas</button>
        <div class="temp-row">
          <input class="h-temp" type="number" min="8" max="36" value="20" inputmode="numeric" aria-label="Solltemperatur">
          <span>°C</span>
          <button class="btn h-tempstart">Temperatur</button>
        </div>
        <div class="extend-row" hidden>
          <span class="muted">Verlängern</span>
          <button class="btn h-extend" data-min="60">+1 h</button>
          <button class="btn h-extend" data-min="120">+2 h</button>
        </div>
        <button class="btn danger h-stop">Ausschalten</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
